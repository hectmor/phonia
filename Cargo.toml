[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alsa = "0.12.1"
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "5"
futures-executor = "0.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
pulseaudio = "0.3.1"
quick-xml = "0.41"
rand = "0.10.2"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["flac", "isomp4"] }
tidlers = "0.5.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
phonia-core = { path = "crates/phonia-core" }
phonia-ipc = { path = "crates/phonia-ipc" }
phonia-tui = { path = "crates/phonia-tui" }
