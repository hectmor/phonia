# `cargo deny check licenses` -- the guard that stops a GPL dependency arriving
# unnoticed. Run in CI; see CONTRIBUTING.md.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[licenses]
# Anything not on this list fails the build, on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # See about.toml for why MPL-2.0 is acceptable here, and when it stops being.
    "MPL-2.0",
]
confidence-threshold = 0.9
